<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="300" fill="#6366f1" opacity="0.1" />
  <circle cx="100" cy="530" r="250" fill="#a855f7" opacity="0.1" />

  <!-- Piano Keys Graphic -->
  <g transform="translate(650, 180)">
    <!-- White Keys -->
    <rect x="0" y="0" width="60" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="65" y="0" width="60" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="130" y="0" width="60" height="240" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
    <rect x="195" y="0" width="60" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="260" y="0" width="60" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="325" y="0" width="60" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="390" y="0" width="60" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Black Keys -->
    <rect x="40" y="0" width="40" height="140" rx="6" fill="#0f172a"/>
    <rect x="105" y="0" width="40" height="140" rx="6" fill="#0f172a"/>
    <rect x="235" y="0" width="40" height="140" rx="6" fill="#0f172a"/>
    <rect x="300" y="0" width="40" height="140" rx="6" fill="#a855f7"/>
    <rect x="365" y="0" width="40" height="140" rx="6" fill="#0f172a"/>
  </g>

  <!-- Staff Lines & Musical Note -->
  <g transform="translate(650, 460)">
    <line x1="0" y1="0" x2="450" y2="0" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="20" x2="450" y2="20" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="40" x2="450" y2="40" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="60" x2="450" y2="60" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="80" x2="450" y2="80" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>

    <!-- Quarter Note -->
    <ellipse cx="225" cy="40" rx="16" ry="12" fill="#a855f7" transform="rotate(-20 225 40)"/>
    <line x1="239" y1="35" x2="239" y2="-20" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Branding & Text -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="url(#accent)" opacity="0.2"/>
    <text x="70" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#a855f7" text-anchor="middle" letter-spacing="1">PIANO VIRTUAL</text>

    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">PianoConNotas</text>
    
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="26" fill="#cbd5e1" width="500">
      <tspan x="0" dy="0">Piano Interactivo con Teclado,</tspan>
      <tspan x="0" dy="38">Pentagrama en Tiempo Real y Partituras PDF.</tspan>
    </text>
  </g>
</svg>
